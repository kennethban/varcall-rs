# CPU-only build and tests (GitHub's runners have no GPU): unit tests, then tests/selftest.sh, which aligns synthetic
# reads with align-rs and bwa-mem2 and runs variant-rs against the GATK truth committed in tests/truth.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Build and test (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}     # login shell: activates the micromamba environment
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-cpu=x86-64-v3     # as the Docker images; the AVX-512 PairHMM is still chosen at run time
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true

      - uses: Swatinem/rust-cache@v2

      - name: CPU
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)):'
          echo "AVX-512: $(grep -q avx512f /proc/cpuinfo && echo yes || echo no)"

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --workspace --locked

      - name: Self-contained test
        run: tests/selftest.sh

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs
          path: |
            target/selftest/**/*.log
          if-no-files-found: ignore

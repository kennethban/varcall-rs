[package]
name = "variant-rs"
license = "MIT"
authors = ["Kenneth Ban", "Claude (Anthropic)"]
build = "build.rs"
version = "0.1.0"
edition = "2021"
description = "GATK 4.7-compatible preprocessing and variant calling in Rust + CUDA (HaplotypeCaller, BQSR, MarkDuplicates, Mutect2 and its filters), output byte-identical to GATK"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1"
libdeflater = "1"
mimalloc = { version = "0.1", default-features = false }
memchr = "2"
serde_json = "1"
hc-preproc = { path = "crates/preproc" }
hc-assembly = { path = "crates/assembly" }
hc-likelihood = { path = "crates/likelihood" }
hc-genotype = { path = "crates/genotype" }
hc-cudahmm = { path = "crates/cudahmm" }
hc-refconf = { path = "crates/refconf" }
hc-downsample = { path = "crates/downsample" }

[build-dependencies]
cc = "1"

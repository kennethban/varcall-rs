[package]
name = "hc-assembly"
version = "0.1.0"
edition = "2021"
description = "Rust port of GATK 4.7 HaplotypeCaller local assembly (ReadThreadingAssembler.runLocalAssembly, default arguments)"

[lib]
name = "hc_assembly"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "assembly-validate"
path = "src/bin/validate.rs"

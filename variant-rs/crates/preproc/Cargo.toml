[package]
name = "hc-preproc"
version = "0.1.0"
edition = "2021"
description = "Port of GATK 4.7 HaplotypeCaller AssemblyBasedCallerUtils.finalizeRegion (per-region read preprocessing)"

[lib]
name = "hc_preproc"
path = "src/lib.rs"

[features]
default = ["validate"]
validate = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "preproc-validate"
path = "src/bin/validate.rs"
required-features = ["validate"]

